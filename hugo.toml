# No Fate — https://github.com/OliverObst/no-fate  (commit 15da703, vendored as submodule)
# CUSTOMISING: colours → assets/css/extended/palette.css
#              homepage → content/_index.md
#              comments → layouts/_partials/comments.html

baseURL = 'https://vidhyakorn.github.io/vma/'
locale = 'en'
defaultContentLanguage = 'en'
title = 'Vidhyakorn Mahd-Adam'
theme = 'no-fate'

enableRobotsTXT = true
enableInlineShortcodes = true
enableGitInfo = true   # populates .Lastmod from git

# Obsidian note templates live in content/_templates/ — not pages, never published.
ignoreFiles = ['content/_templates/.*', '\.obsidian/.*']

[outputs]
  home = ['html', 'rss', 'json']   # json feeds no-fate's search index
  page = ['html']
  section = ['html', 'rss']

[taxonomies]
  tag = 'tags'

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.parser.attribute]
      block = true
      title = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# ---------------------------------------------------------------------------
# Top navigation — no-fate wild style shows these in a grid header.
# 'secondary' appears as small text under each nav label.
# ---------------------------------------------------------------------------
[[menu.main]]
  name = 'Home'
  pageRef = '/'
  weight = 1
[[menu.main]]
  name = 'Research'
  pageRef = '/research'
  weight = 2
[[menu.main]]
  name = 'Publications'
  pageRef = '/publications'
  weight = 3
[[menu.main]]
  name = 'Writings'
  pageRef = '/note'
  weight = 4
[[menu.main]]
  name = 'Contact'
  pageRef = '/about'   # no /contact page yet — create content/contact/ and change this back
  weight = 5

[services]
  [services.googleAnalytics]
    ID = "G-P1DPV6CWY5"

[params]
  author = 'Vidhyakorn Mahd-Adam'
  description = 'Vidhyakorn Mahd-Adam — research assistant at MORU, Bangkok. Epidemiological and social modelling, health policy, and the history and philosophy of science and medicine.'
  dateFormat = 'January 2, 2006'
  defaultTheme = 'auto'

  # mainSections drives what shows up in listing pages and the feed
  mainSections = ['note', 'research']

  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowToc = true

  # Publication metadata lookups — Crossref serves identified requests faster.
  # See layouts/_partials/pub-block.html.
  crossrefMailto = 'vidhyakornadam@gmail.com'

  # Social links — icons at the right of the top bar
  # (layouts/_partials/social-links.html; icons in data/icons.yaml).
  # Leave url empty to hide an entry until you have the address.
  [[params.social]]
    name = 'LinkedIn'
    icon = 'linkedin'
    url = 'https://www.linkedin.com/in/vidhyakorn/'
  [[params.social]]
    name = 'ORCID'
    icon = 'orcid'
    url = 'https://orcid.org/0009-0008-2468-8870'
  [[params.social]]
    name = 'Google Scholar'
    icon = 'googlescholar'
    url = ''   # e.g. 'https://scholar.google.com/citations?user=XXXXXXXXXXXX'
  [[params.social]]
    name = 'Bluesky'
    icon = 'bluesky'
    url = ''   # e.g. 'https://bsky.app/profile/yourhandle.bsky.social'
  [[params.social]]
    name = 'GitHub'
    icon = 'github'
    url = 'https://github.com/vidhyakorn'

  # Site title in the top bar, drawn as the handwritten signature
  # (layouts/_partials/header.html). Black ink for light mode, white for dark.
  [params.label]
    text = 'Vidhyakorn Mahd-Adam'
    icon = 'img/vmd.png'
    iconDark = 'img/vmd-dark.png'

  # ---------------------------------------------------------------------------
  # no-fate theme settings
  # ---------------------------------------------------------------------------
  [params.noFate]
    style = "clean"
    defaultMode = "editorial"
    defaultAccent = "signal"
    showThemeToggle = true
    showSearch = true
    showReadingTime = true
    showPropositions = false
    enableImageProcessing = true
    validateContentModel = false   # relax during migration; tighten later
    strictHomeSelections = false

  [params.noFate.home]
    modules = ["opening", "selected_writing"]
    featuredProposition = ""

  [params.noFate.images]
    widths = [480, 800, 1200, 1600]
    webpQuality = 82

  # ---------------------------------------------------------------------------
  # Comments — giscus, stored as GitHub Discussions on the vidhyakorn/vma repo.
  # Rendered by layouts/_partials/comments.html (our override).
  # ---------------------------------------------------------------------------
  [params.comments]
    enable = true
    [params.comments.giscus]
      repo = 'vidhyakorn/vma'
      repoId = 'R_kgDOUg27EQ'
      category = 'General'
      categoryId = 'DIC_kwDOUg27Ec4DGI17'
      mapping = 'title'
      strict = 0
      reactionsEnabled = 1
      emitMetadata = 1
      inputPosition = 'top'
      lang = 'en'

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# ---------------------------------------------------------------------------
# Folder mounts. The last entry makes static/img visible to Hugo image
# processing, so card pictures are resized to small WebP instead of full-size.
# ---------------------------------------------------------------------------
[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = 'static/img'
    target = 'assets/img'
