{{/* layouts/_default/cv.html — dedicated CV page, download button in content column */}}
{{ define "main" }}
  {{- $pdfPath := "cv/vidhyakorn_cv_Oct26.pdf" | absURL -}}
  <div class="cv-page-wrap">
    <div class="cv-dl-row">
      <a href="{{ $pdfPath }}" download class="cv-dl-btn">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1v9M8 10l-3-3M8 10l3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Download PDF
      </a>
    </div>
    <main id="content" class="cv-content">
      {{ .Content }}
    </main>
  </div>
{{ end }}
