  - slug: taking-charge-of-adhd
    title: "Taking Charge of ADHD"
    subtitle: "The Complete, Authoritative Guide for Parents — fourth edition"
    author: "Russell A. Barkley"
    year: 1995
    isbn: "9781462542673"
    cover: ""
    projects: [ndls]
    status: read
    note: >
      The evidence-based counterweight to most of this list. Barkley is the
      researcher who made the case that ADHD is primarily a disorder of
      executive function and self-regulation, and this is him writing for
      parents without softening what the trials actually show. Where he and
      Maté disagree is the most productive argument in the field, and a model
      that cannot hold both positions open is not yet a model.
    buy:
