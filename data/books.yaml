  - slug: scattered-minds
    title: "Scattered Minds"
    subtitle: "The Origins and Healing of Attention Deficit Disorder"
    author: "Gabor Maté"
    year: 1999
    isbn: "9781785042218"
    cover: ""
    projects: [ndls]
    status: read
    note: >
      Maté's case that ADHD is less an inherited defect than a developmental
      adaptation — laid down early, in the relationship between a child and the
      people around them. The causal claim is contested and the evidence is
      clinical rather than epidemiological, which is exactly why it is useful
      here: it is the strongest available statement of the position a
      life-course model has to be able to represent and then test, instead of
      assuming away.
    buy:
      asiabooks: ""
      kinokuniya: ""
      amazon: ""
