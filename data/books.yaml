  - slug: hunter-in-a-farmers-world
    title: "ADHD: A Hunter in a Farmer's World"
    subtitle: "Thom Hartmann, with a foreword by Michael Popkin"
    author: "Thom Hartmann"
    year: 1993
    isbn: "9781620558980"
    cover: ""
    projects: [ndls]
    status: read
    note: >
      The hunter-farmer hypothesis: that the trait cluster was adaptive for
      foraging and only becomes a disorder in a settled, timetabled society.
      As evolutionary history it is speculative and largely untested. As a
      framing device it is the clearest popular statement of the idea NDLS is
      built on — that the pathology is in the fit between a person and a
      setting, not in the person alone. Read it for the frame, not the
      evidence. This 2019 edition is a revision of his 1993 book.
    buy:
      asiabooks: ""
      kinokuniya: ""
      amazon: ""
    free:
