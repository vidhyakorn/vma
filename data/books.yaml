  - slug: body-keeps-the-score
    title: "The Body Keeps the Score"
    subtitle: "Mind, Brain and Body in the Transformation of Trauma"
    author: "Bessel van der Kolk"
    year: 2014
    isbn: "9780143127741"
    # A picture of the cover. Either a file in static/img/books/, or an address
    # on the web — https://covers.openlibrary.org/b/isbn/9780143127741-L.jpg
    # serves covers for exactly this purpose.
    cover: ""
    projects: [ndls]
    status: read
    note: >
      The case that trauma is carried in the body and in development, not only
      in memory — and that recovery is a matter of restoring what a person can
      do, not only of relieving symptoms. It is the clearest argument I know
      for why a model of neurodevelopment has to run across a whole life and
      include the body, and it is where the capability side of NDLS starts to
      look less like philosophy and more like clinical necessity.
    buy:
      asiabooks: "https://www.asiabooks.com/th/body-keeps-the-score-the-mind-brain-and-body-in-the-transformation-of-trauma.html"
      kinokuniya: ""
