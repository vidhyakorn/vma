    subtitle: "A Guide to (Mostly) Thriving with ADHD"
    author: "Penn Holderness and Kim Holderness"
    year: 2024
    isbn: "9781400338610"
    cover: ""
    projects: [ndls]
    status: read
    note: >
      Not a clinical book and not pretending to be one: a married couple, one
      with ADHD and one without, on what the day actually looks like — systems,
      arguments, repair. It is here because a capability account has to be
      answerable to this level of description, where the question is not what a
      diagnosis predicts but what a household manages to do.
